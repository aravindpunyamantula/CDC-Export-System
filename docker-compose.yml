version: '3.8'

services:
  app:
    build: .
    container_name: cdc_app

    ports:
      - "8080:8080"

    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://user:password@db:5432/mydatabase

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - .:/app
      - /app/node_modules
      - ./output:/app/output


  db:
    image: postgres:15
    container_name: cdc_db

    restart: always

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: